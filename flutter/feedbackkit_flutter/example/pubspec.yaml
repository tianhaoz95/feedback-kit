name: feedbackkit_flutter_example
description: "FeedbackKit's Flutter demo app — the same Home/Cart/Settings sample as the native iOS and Android demos."
publish_to: 'none'

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  feedbackkit_flutter:
    path: ../
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
