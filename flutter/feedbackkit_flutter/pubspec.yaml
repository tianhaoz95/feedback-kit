name: feedbackkit_flutter
description: "In-app feedback for Flutter apps: capture a screenshot, annotate it, describe the problem, and get a structured FeedbackKit report. Runs the native FeedbackKit iOS and Android SDKs under the hood."
version: 1.0.62
homepage: https://github.com/tianhaoz95/feedback-kit
repository: https://github.com/tianhaoz95/feedback-kit/tree/main/flutter

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.feedbackkit.flutter
        pluginClass: FeedbackKitFlutterPlugin
      ios:
        pluginClass: FeedbackKitFlutterPlugin
