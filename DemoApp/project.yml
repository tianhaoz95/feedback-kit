name: FeedbackKitDemo
options:
  bundleIdPrefix: com.feedbackkit.demo
  deploymentTarget:
    iOS: "15.0"
    # Higher than the SDK's own macOS 12.0 minimum (Package.swift) — this is
    # just the demo app's own target, free to use NavigationSplitView (13+),
    # not a claim about what FeedbackKit itself requires.
    macOS: "13.0"
    # Higher than the SDK's own watchOS 8.0 minimum for the same reason as
    # macOS above — this Xcode's watchOS Simulator only supports 9.0+ as a
    # deployment target at all (confirmed by a real build failure, not
    # assumed), independent of what FeedbackKit itself requires.
    watchOS: "9.0"
targets:
  FeedbackKitDemo:
    type: application
    platform: iOS
    sources:
      - path: DemoApp
    info:
      path: Generated/Info.plist
      properties:
        # From the build settings, so release scripts' MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION overrides reach the app (FeedbackKit's fix
        # verification compares the device's CFBundleVersion to the build a fix shipped in).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Local Supabase (`supabase start`) serves plain HTTP on 127.0.0.1 —
        # this lets the demo app's FeedbackKit.configure(...) reach it from
        # the simulator without ATS blocking the request. Only relevant if
        # you uncomment the presentAndSubmit / configure call in
        # FeedbackKitDemoApp.swift to test the hosted-submission path.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.feedbackkit.demo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: FeedbackKit

  # Reuses CartStore.swift from the iOS target's Support/ folder directly
  # (see the `sources` entry below) rather than duplicating it, so "one
  # shared model, three native UIs" is actually true of this repo and not
  # just claimed by it — Home/Cart add-to-cart state is shared the same way
  # it already is between the iOS SwiftUI and UIKit screens.
  FeedbackKitDemoMac:
    type: application
    platform: macOS
    sources:
      - path: DemoMacApp
      - path: DemoApp/Support/CartStore.swift
      - path: DemoApp/Support/DemoSettings.swift
      - path: DemoApp/Support/DemoBranding.swift
      - path: DemoApp/Support/DemoNotifier.swift
    info:
      path: Generated/Info-Mac.plist
      properties:
        # From the build settings, so release scripts' MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION overrides reach the app (FeedbackKit's fix
        # verification compares the device's CFBundleVersion to the build a fix shipped in).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Same reasoning as the iOS target's NSAppTransportSecurity above.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.feedbackkit.demo.mac
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: FeedbackKit

  # A standalone watchOS app (WKApplication, no iOS companion) — matches
  # how the SDK itself treats watchOS: no window to present a full flow
  # over, just FeedbackQuickNoteView embedded in a `.sheet`.
  FeedbackKitDemoWatch:
    type: application
    platform: watchOS
    sources:
      - path: DemoWatchApp
    info:
      path: Generated/Info-Watch.plist
      properties:
        # From the build settings, so release scripts' MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION overrides reach the app (FeedbackKit's fix
        # verification compares the device's CFBundleVersion to the build a fix shipped in).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Both required for a truly standalone watch app (no iOS host, no
        # WKCompanionAppBundleIdentifier): WKApplication marks it as a watch
        # app at all, WKWatchOnly says it has no iOS companion. Confirmed by
        # real `simctl install` failures asking for each in turn when only
        # one was set.
        WKApplication: true
        WKWatchOnly: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.feedbackkit.demo.watch
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
    dependencies:
      - package: FeedbackKit
packages:
  FeedbackKit:
    path: ..
