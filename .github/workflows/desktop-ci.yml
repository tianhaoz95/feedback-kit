name: Desktop (Tauri + Electron) CI

# feedbackkit-electron and tauri-plugin-feedbackkit / feedbackkit-tauri, with
# their demo apps' end-to-end tests on all three desktop OSes. Both layer on
# the web SDK, so web-sdk changes run this too.
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "web-sdk/src/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "web-sdk/src/**"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron:
    name: Electron (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package (types, unit tests)
        working-directory: desktop/electron
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          npm test
      - name: Demo app end-to-end
        working-directory: desktop/electron-demo
        shell: bash
        run: |
          npm install --no-audit --no-fund
          node node_modules/electron/install.js
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:e2e
          else
            npm run test:e2e
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electron-e2e-${{ matrix.os }}
          path: desktop/electron-demo/e2e/output
          if-no-files-found: ignore
          retention-days: 7

  tauri:
    name: Tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/tauri
            desktop/tauri-demo/src-tauri
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - name: Plugin unit tests
        working-directory: desktop/tauri
        run: cargo test
      - name: feedbackkit-tauri (types)
        working-directory: desktop/tauri/guest-js
        run: |
          npm install --no-audit --no-fund
          npm run lint
      - name: Build the demo app
        working-directory: desktop/tauri-demo
        run: |
          npm install --no-audit --no-fund
          npx tauri build --debug --no-bundle
      - name: Demo app end-to-end self-test
        working-directory: desktop/tauri-demo
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a node e2e/selftest.mjs
          else
            node e2e/selftest.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-selftest-${{ matrix.os }}
          path: desktop/tauri-demo/e2e/output
          if-no-files-found: ignore
          retention-days: 7
