name: Release macOS Demo

# Builds, signs (Developer ID Application), notarizes and publishes the
# FeedbackKitDemoMac demo app as a GitHub Release asset — the macOS
# counterpart to testflight.yml, except this ships a DMG to a GitHub
# Release instead of an .ipa to App Store Connect, since a demo app has no
# App Store listing.
#
# Fires on:
#   - Publishing a release (attaches notarized DMG to the release)
#   - Manual trigger from the Actions tab (workflow_dispatch)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z) — creates/attaches to tag vX.Y.Z"
        required: false
      tag:
        description: "Release tag to attach to (e.g. v1.0.0)"
        required: false
      no_upload:
        description: "Build, sign and notarize only — don't create/attach to a release (pipeline validation)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ inputs.no_upload == true && format('release-macos-demo-validate-{0}', github.run_id) || format('release-macos-demo-{0}', github.event.release.tag_name || github.ref_name || inputs.tag || inputs.version || 'latest') }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Sign, Notarize & Publish
    if: github.event_name != 'release' || (!startsWith(github.event.release.tag_name, 'cli-'))
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 || secrets.APPLE_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # A fresh, temporary keychain holding only this one certificate,
      # deleted in the cleanup step below regardless of how the job ends —
      # same reasoning as testflight.yml's signing-certificate import, but
      # with the Developer ID Application cert (direct distribution) rather
      # than the Apple Development one (App Store / TestFlight) that uses.
      # They're deliberately different certificates for different purposes,
      # hence separate secrets (MACOS_CERTIFICATE*, not SIGNING_P12*).
      - name: Import Developer ID signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release-macos-demo.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/signing.p12"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS="$(security list-keychains -d user | sed 's/[[:space:]]*"\(.*\)"/\1/')"
          # shellcheck disable=SC2086 # intentional word-splitting: each keychain path is its own positional arg
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -s "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Resolve version/tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#mac-demo-v}"
            VERSION="${VERSION#v}"
          else
            INPUT_TAG="${{ inputs.tag }}"
            INPUT_VER="${{ inputs.version }}"
            if [ -n "$INPUT_TAG" ]; then
              TAG="$INPUT_TAG"
              VERSION="${TAG#mac-demo-v}"
              VERSION="${VERSION#v}"
            elif [ -n "$INPUT_VER" ]; then
              VERSION="${INPUT_VER#v}"
              TAG="v${VERSION}"
            elif [ "${{ inputs.no_upload }}" = "true" ]; then
              VERSION="0.0.0"
              TAG="v0.0.0"
            else
              TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)"
              [ -n "$TAG" ] || { echo "error: couldn't resolve release tag" >&2; exit 1; }
              VERSION="${TAG#mac-demo-v}"
              VERSION="${VERSION#v}"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build, sign, notarize and publish
        env:
          GH_TOKEN: ${{ github.token }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ARGS=(--version "${{ steps.version.outputs.version }}" --tag "${{ steps.version.outputs.tag }}")
          [ "${{ inputs.no_upload }}" = "true" ] && ARGS+=(--no-upload)
          ./scripts/release_macos_demo.sh "${ARGS[@]}"

      - name: Upload the DMG as a workflow artifact
        if: ${{ inputs.no_upload == true }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-demo-dmg
          path: build/release-macos-demo/*.dmg
          if-no-files-found: error

      - name: Clean up secrets
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys"
          if [ -n "${SIGNING_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi
