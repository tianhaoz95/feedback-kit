name: FeedbackPortal
options:
  bundleIdPrefix: com.feedbackkit.developer
  deploymentTarget:
    iOS: "17.0"
targets:
  FeedbackPortal:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "Portal"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.feedbackkit.developer
            CFBundleURLSchemes:
              - feedbackkit
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.feedbackkit.developer
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: FeedbackKit

  FeedbackPortalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    info:
      path: Generated/Info-Tests.plist
    dependencies:
      - target: FeedbackPortal
      - package: FeedbackKit
packages:
  FeedbackKit:
    path: ..

schemes:
  FeedbackPortal:
    build:
      targets:
        FeedbackPortal: all
    test:
      targets:
        - FeedbackPortalTests
    run:
      config: Debug
